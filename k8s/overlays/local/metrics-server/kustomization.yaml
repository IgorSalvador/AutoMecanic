# metrics-server: sem ele o HPA não enxerga CPU nem memória. O kind usa certificados
# autoassinados nos kubelets, por isso o --kubelet-insecure-tls (só vale para o cluster local).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml

patches:
  - target:
      kind: Deployment
      name: metrics-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
