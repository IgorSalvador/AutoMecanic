apiVersion: apps/v1
kind: Deployment
metadata:
  name: automecanic-api
  labels:
    app.kubernetes.io/name: automecanic-api
spec:
  # O HPA assume o controle da quantidade; este é o piso inicial.
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: automecanic-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: automecanic-api
    spec:
      serviceAccountName: automecanic-api
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        # UID do usuário "app" da imagem chiseled; numérico, para o kubelet poder validar runAsNonRoot.
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: automecanic-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: automecanic-api
            - secretRef:
                name: automecanic-api
          # O HPA calcula a porcentagem de uso sobre os requests. A memória é folgada de propósito:
          # depois de um pico o .NET retém ~130Mi por pod, e com um request menor a utilização
          # ficaria acima do alvo de 80% e o HPA nunca voltaria às 2 réplicas.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Dá até ~60 s para o processo subir antes de a vivacidade começar a valer.
          startupProbe:
            httpGet:
              path: /health/vivo
              port: http
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health/vivo
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Só recebe tráfego com o banco acessível.
          readinessProbe:
            httpGet:
              path: /health/pronto
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # A imagem não tem shell; a ação nativa "sleep" dá tempo ao balanceador de tirar o
              # pod da rotação antes de a aplicação começar a encerrar.
              sleep:
                seconds: 5
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: automecanic-api
