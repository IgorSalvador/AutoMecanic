apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: automecanic-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: automecanic-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      # Janela curta (o padrão é 300 s) para a descida caber na demonstração em vídeo.
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
