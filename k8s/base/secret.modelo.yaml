# MODELO — não é aplicado por nenhum kustomization e não deve receber valores reais no git.
# Mostra as chaves que o Deployment, o Job e o CronJob esperam no Secret "automecanic-api".
#
# Criação manual, sem arquivo:
#   kubectl -n automecanic create secret generic automecanic-api \
#     --from-literal=ConnectionStrings__PostgreSQL='Host=...;Port=5432;Database=automecanic;Username=...;Password=...' \
#     --from-literal=Jwt__ChaveDeAssinatura="$(openssl rand -base64 48)" \
#     --from-literal=Seed__SenhaDoAdministrador='...' \
#     --from-literal=Smtp__Usuario='...' \
#     --from-literal=Smtp__Senha='...'
apiVersion: v1
kind: Secret
metadata:
  name: automecanic-api
  namespace: automecanic
type: Opaque
stringData:
  ConnectionStrings__PostgreSQL: "<cadeia de conexão do PostgreSQL>"
  Jwt__ChaveDeAssinatura: "<mínimo de 32 caracteres>"
  Seed__SenhaDoAdministrador: "<8+ caracteres com maiúscula, minúscula, dígito e símbolo>"
  Smtp__Usuario: "<usuário SMTP; vazio no Mailpit>"
  Smtp__Senha: "<senha SMTP ou senha de app; vazio no Mailpit>"
