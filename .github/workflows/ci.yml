# Integração contínua: compila, testa, mede cobertura e varre vulnerabilidades.
#
# O objetivo é que nenhum dos controles descritos em docs/06-relatorio-de-seguranca.md
# possa regredir sem que o pipeline reprove — em particular, a cobertura mínima dos
# domínios críticos e a ausência de dependência vulnerável.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-e-teste:
    name: Compilação e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar dependências
        run: dotnet restore

      - name: Compilar
        run: dotnet build --configuration Release --no-restore

      # Os testes de integração sobem um PostgreSQL real via Testcontainers.
      # O runner do GitHub já tem Docker disponível, sem configuração adicional.
      - name: Executar testes com cobertura
        run: |
          dotnet test --configuration Release --no-build \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory TestResults \
            --logger "trx;LogFileName=resultados.trx"

      - name: Gerar relatório de cobertura
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:coverage \
            -reporttypes:"Html;Cobertura;MarkdownSummaryGithub;TextSummary"

      - name: Publicar resumo de cobertura
        if: always()
        run: cat coverage/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      # O requisito exige 80% nos domínios críticos. O limiar de 80% no total
      # é mais rigoroso do que o pedido e impede regressão silenciosa.
      - name: Verificar limiar de cobertura
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/Cobertura.xml
          fail_below_min: true
          thresholds: '80 90'
          format: markdown
          output: both

      - name: Publicar artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-de-teste-e-cobertura
          path: |
            TestResults/**/*.trx
            coverage/

  seguranca:
    name: Análise de vulnerabilidades
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependências
        run: dotnet restore

      # Reprova o pipeline se qualquer dependência, direta ou transitiva,
      # tiver vulnerabilidade conhecida.
      #
      # A verificação é feita sobre a saída JSON, e não sobre o texto: a mensagem
      # "The following sources were used" contém a sequência "low", e um grep
      # insensível a maiúsculas por severidade acusava vulnerabilidade onde não havia.
      # O JSON também independe do idioma configurado no runner.
      - name: Varredura de dependências
        run: |
          dotnet list package --vulnerable --include-transitive --format json > vulneraveis.json

          FILTRO='[ .projects[]?.frameworks[]? | ((.topLevelPackages // []) + (.transitivePackages // []))[]? | .vulnerabilities[]? ] | length'
          TOTAL=$(jq "$FILTRO" vulneraveis.json)

          if [ "$TOTAL" -gt 0 ]; then
            echo "::error::$TOTAL vulnerabilidade(s) encontrada(s) em dependências."
            jq -r '.projects[]?.frameworks[]?
                   | ((.topLevelPackages // []) + (.transitivePackages // []))[]?
                   | select((.vulnerabilities // []) | length > 0)
                   | .id as $pacote
                   | .resolvedVersion as $versao
                   | .vulnerabilities[]
                   | "  \($pacote) \($versao) — \(.severity): \(.advisoryurl)"' vulneraveis.json
            exit 1
          fi

          echo "Nenhuma dependência vulnerável."

      - name: Relatar pacotes depreciados
        continue-on-error: true
        run: dotnet list package --deprecated

      - name: Construir a imagem de contêiner
        run: docker build --tag automecanic-api:ci .

      # A varredura é feita em dois passos porque o formato SARIF ignora o filtro de
      # severidade — o próprio Trivy registra "Building SARIF report with all severities".
      # Com um passo só, o exit-code reprovaria por qualquer achado MEDIUM ou LOW, e não
      # pelo critério que queremos.

      # 1 · Portão: reprova o pipeline apenas em vulnerabilidade crítica ou alta.
      - name: Varrer a imagem com Trivy (portão)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: automecanic-api:ci
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln,secret,misconfig
          ignore-unfixed: false
          exit-code: '1'

      # 2 · Relatório: registra todas as severidades, sem reprovar.
      - name: Varrer a imagem com Trivy (relatório completo)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: automecanic-api:ci
          format: sarif
          output: trivy.sarif
          scanners: vuln,secret,misconfig
          exit-code: '0'

      # O envio ao Code Scanning depende do GitHub Advanced Security, que não está
      # disponível em repositório privado sem licença — e o requisito exige repositório
      # privado. O passo fica como conveniência para quem tiver a licença; sua falha não
      # reprova o pipeline, porque o portão acima já cumpre o papel de barreira.
      - name: Enviar resultado para o Code Scanning
        if: always() && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      - name: Publicar o relatório completo no resumo do job
        if: always() && hashFiles('trivy.sarif') != ''
        run: |
          {
            echo '## Varredura da imagem de contêiner'
            echo
            jq -r '
              [ .runs[].results[]? ] as $achados
              | "Total de achados: \($achados | length)"
            ' trivy.sarif
            echo
            echo '<details><summary>Detalhes</summary>'
            echo
            echo '```'
            jq -r '.runs[].results[]? | "\(.ruleId): \(.message.text // "")"' trivy.sarif | sort -u | head -60
            echo '```'
            echo '</details>'
          } >> $GITHUB_STEP_SUMMARY

  ambiente-completo:
    name: Ambiente completo em contêiner
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Verifica o que o avaliador vai fazer: copiar o .env de exemplo e subir tudo.
      - name: Preparar configuração
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -base64 24)|" .env
          sed -i "s|^JWT_CHAVE=.*|JWT_CHAVE=$(openssl rand -base64 48)|" .env

      - name: Subir o ambiente
        run: docker compose up -d --build

      - name: Aguardar a API ficar saudável
        run: |
          for tentativa in $(seq 1 40); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' automecanic-api)" = "healthy" ]; then
              echo "API saudável na tentativa $tentativa."
              exit 0
            fi
            sleep 5
          done
          echo "::error::A API não ficou saudável a tempo."
          docker compose logs api
          exit 1

      - name: Verificar Swagger e prontidão
        run: |
          curl --fail --silent http://localhost:8080/health/pronto
          curl --fail --silent http://localhost:8080/swagger/v1/swagger.json > /dev/null
          echo "Documentação OpenAPI disponível."

      # Executa a coleção Postman contra o ambiente recém-subido. É o que impede a
      # coleção de envelhecer em silêncio: se um endpoint mudar de contrato, o fluxo
      # guiado quebra aqui, e não na mão de quem for demonstrar o sistema.
      - name: Executar a coleção Postman
        run: |
          SENHA=$(grep '^SEED_SENHA_ADMIN=' .env | cut -d= -f2-)
          npx --yes newman run postman/AutoMecanic.postman_collection.json \
            --folder "00 · Fluxo completo da Ordem de Serviço" \
            --env-var "senhaAdmin=$SENHA" \
            --reporters cli \
            --color off

      # A parte de referência da coleção é derivada do OpenAPI. Se ela estiver
      # desatualizada, o arquivo regerado difere do versionado — e o aviso aparece
      # aqui, sem reprovar o pipeline por uma diferença cosmética de data.
      - name: Conferir se a coleção está atualizada
        continue-on-error: true
        run: |
          node tools/gerar-collection.mjs --saida /tmp/postman-gerado
          if ! diff -q \
              <(jq 'del(.info.description)' postman/AutoMecanic.postman_collection.json) \
              <(jq 'del(.info.description)' /tmp/postman-gerado/AutoMecanic.postman_collection.json) > /dev/null; then
            echo "::warning::A coleção versionada difere da gerada. Rode 'node tools/gerar-collection.mjs' e comite."
          else
            echo "Coleção sincronizada com o OpenAPI."
          fi

      - name: Encerrar
        if: always()
        run: docker compose down -v
